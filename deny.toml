# cargo-deny: known vulnerabilities, licences and where crates come from. Run: cargo deny check

[advisories]
# A vulnerability fails always. "Unmaintained" fails only for our own dependencies: the ones
# reported today (instant, paste, rustybuzz, ttf-parser) all come through gpui-kit.
unmaintained = "workspace"

[licenses]
# Every licence in the tree today (cargo deny list, 2026-10-17), all compatible with
# MIT OR Apache-2.0. GPL and LGPL crates in the tree are dual-licensed with one of these.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
# GPUI's tree carries several versions of some crates; reported, not failed.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
