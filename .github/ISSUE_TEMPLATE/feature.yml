name: Feature request
description: Something Ithildin should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The data or question you have, and where Ithildin falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. A new source type, a view, an MCP tool, …
  - type: textarea
    id: data
    attributes:
      label: Example data
      description: A few lines of the data you would bring in, with anything private left out.
